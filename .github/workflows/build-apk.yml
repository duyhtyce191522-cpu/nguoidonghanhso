name: Xuất File Cài Đặt Android APK (Đồng Hành Số)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 3. Thiết lập môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Cài đặt thư viện Frontend
        run: |
          cd frontend
          npm install

      - name: 5. Biên dịch ứng dụng Frontend
        run: |
          cd frontend
          npm run build

      - name: 6. Đồng bộ mã nguồn sang nền tảng Android Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: 7. Cấp quyền thực thi cho Gradle
        run: |
          chmod +x frontend/android/gradlew

      - name: 8. Đóng gói file cài đặt Android APK (assembleDebug)
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Chuẩn bị file APK xuất bản
        run: |
          mkdir -p output-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output-apk/DongHanhSo.apk

      - name: 10. Đăng tải file cài đặt APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DongHanhSo-Android-APK
          path: output-apk/DongHanhSo.apk
          retention-days: 30
