name: Xuất File Cài Đặt Android APK (Đồng Hành Số)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 3. Thiết lập môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Cài đặt thư viện Frontend
        working-directory: frontend
        run: npm install

      - name: 5. Biên dịch ứng dụng Frontend
        working-directory: frontend
        run: npm run build

      - name: 6. Đồng bộ mã nguồn sang nền tảng Android Capacitor
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          npx @capacitor/cli sync android || true

      - name: 7. Cấp quyền thực thi cho Gradle
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: 8. Đóng gói file cài đặt Android APK (assembleDebug)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Chuẩn bị file APK xuất bản
        run: |
          mkdir -p output-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output-apk/DongHanhSo.apk

      - name: 10. Đăng tải file cài đặt APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DongHanhSo-Android-APK
          path: output-apk/DongHanhSo.apk
          retention-days: 30
