name: Xuất File Cài Đặt Android APK (Đồng Hành Số)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 3. Thiết lập Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Thiết lập Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Cài đặt thư viện Frontend
        run: |
          npm --prefix frontend install

      - name: 6. Biên dịch ứng dụng Frontend
        run: |
          npm --prefix frontend run build

      - name: 7. Đồng bộ mã nguồn sang nền tảng Android Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: 8. Cấp quyền thực thi cho Gradle
        run: |
          chmod +x frontend/android/gradlew

      - name: 9. Đóng gói file cài đặt Android APK (assembleDebug)
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: 10. Đổi tên file APK xuất bản
        run: |
          mkdir -p output-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output-apk/DongHanhSo.apk

      - name: 11. Đăng tải file cài đặt APK lên GitHub Artifacts (Tải về miễn phí)
        uses: actions/upload-artifact@v4
        with:
          name: DongHanhSo-Android-APK
          path: output-apk/DongHanhSo.apk
          retention-days: 30
